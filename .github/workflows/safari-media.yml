name: Safari media acceptance (shipping)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"

# Mandatory shipping-Safari evidence for the v0.5 media AND v0.7 phone
# controls/recovery release gates. A missing runner or an unavailable Safari
# FAILS the release prerequisite — there is NO `continue-on-error` and NO
# successful-skip path.
concurrency:
  group: safari-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safari:
    name: Safari media + phone controls/recovery on macOS
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build / pack the browser package (built artifacts only)
        run: npm run build
      # `--enable` grants the "Allow Remote Automation" capability; it requires
      # admin privileges, so run once as root. The runner then spawns a fresh
      # `safaridriver -p 4444` (WebDriver /session) itself. NOTE: `|| true` does
      # NOT make this a soft gate — `--enable` is idempotent and often already set
      # on the runner; the runner's own /session creation is the real availability
      # gate and FAILS loudly (non-zero exit, no skip) if Safari is unusable.
      - name: Enable Safari Remote Automation
        run: sudo safaridriver --enable || true
      - name: Run the Safari acceptance gates (media + phone controls/recovery)
        if: always()
        env:
          # The runner serves the built bundles over per-run CA-issued HTTPS
          # harnesses and points its own WebDriver fetch at that same localhost;
          # the throwaway CA is never committed, so disable TLS verification ONLY
          # for this CI-local link. Safari itself trusts the ephemeral CA via the
          # temp keychain the runner imports it into.
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          HARNESS_PORT: "8443"
          PHONE_HARNESS_PORT: "8444"
          SIP_WSS_PORT: "4200"
          KEYCHAIN_DIR: "${{ runner.temp }}"
          KEYCHAIN_NAME: "sipw-safari.keychain-db"
        run: node test/browser-media/safari-runner.mjs
      - name: Remove ephemeral Safari trust keychain
        if: always()
        run: |
          security default-keychain -s "$HOME/Library/Keychains/login.keychain-db" >/dev/null 2>&1 || true
          security delete-keychain "${{ runner.temp }}/sipw-safari.keychain-db" >/dev/null 2>&1 || true
      - name: Upload Safari runner logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: safari-media-${{ github.run_id }}
          path: |
            test-results/
            console-*.log
          if-no-files-found: ignore
          retention-days: 7

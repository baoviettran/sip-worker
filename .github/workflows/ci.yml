name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-and-test:
    name: Contract + tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Documentation contract
        run: npm run test:docs
      # vitest resolves the workspace subpath exports (e.g. `@sip-worker/core/transport`)
      # against dist/ — a fresh checkout has none, so `npm test` requires the build first.
      - name: Build / pack the browser package (built artifacts only)
        run: npm run build
      - name: Test suite (incl. smoke gate)
        run: npm test
      - name: Packed-consumer gate
        run: npm run test:package
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-and-test:
    name: Contract + tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Documentation contract
        run: npm run test:docs
      - name: Test suite (incl. smoke gate)
        run: npm test
      - name: Packed-consumer gate
        run: npm run test:package
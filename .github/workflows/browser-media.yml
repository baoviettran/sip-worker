name: Browser Media (three-engine) + forced TURN relay

on:
  push:
    branches: [main]
  pull_request:

# Mandatory real-browser + forced-TURN evidence for the v0.5 media release gate.
# Both jobs FAIL on absent infrastructure (missing TURN vars, an engine that
# cannot meet the contract, or a relay that does not relay). There is NO
# continue-on-error and NO successful skip path — required capabilities cannot be
# skipped. A failing gate blocks the release prerequisite.
concurrency:
  group: browser-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  three-engine:
    name: Chromium / Firefox / WebKit real audio
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser engines
        run: npm run test:browser-media:install
      - name: Build / pack the browser package (built artifacts only)
        run: npm run build
      - name: Three-engine real RTP audio suite
        # run the full three-engine suite, EXCLUDING the forced-turn-relay spec
        # (that spec requires provisioned TURN and runs in its own job with coturn).
        run: npx playwright test --test-project=chromium --test-project=firefox --test-project=webkit --grep-invert "forced TURN relay"
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  forced-turn-relay:
    name: Forced TURN relay audio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for the relay gate
        run: npx playwright install --with-deps chromium
      - name: Build / pack the browser package (built artifacts only)
        run: npm run build
      - name: Provision pinned coturn relay
        id: coturn
        env:
          # Per-RUN ephemeral credentials generated fresh each run (never baked
          # into the tree or logs). These are CI secrets, redacted by GitHub.
          TURN_USERNAME: "turn_${{ github.run_id }}_${{ github.run_attempt }}"
          TURN_PASSWORD: "${{ secrets.COTURN_PASSWORD }}"
          TURN_PORT: "3478"
        run: |
          # TURN_USERNAME is generated inline; TURN_PASSWORD is the single CI
          # secret. The bootstrap adds the 127.0.0.2 loopback alias (privileged
          # runner), starts pinned coturn by digest, and bounded health-checks it.
          if [ -z "$TURN_PASSWORD" ]; then
            echo "::error::COTURN_PASSWORD secret not set — the forced-relay gate cannot provision TURN and must FAIL (no skip)."
            exit 1
          fi
          bash test/turn/coturn.bootstrap.sh
      - name: Forced TURN relay gate (relay candidates + two-way audio)
        env:
          TURN_URL: "turn:127.0.0.1"
          TURN_PEER_URL: "turn:127.0.0.2"
          TURN_PORT: "3478"
          TURN_USERNAME: "turn_${{ github.run_id }}_${{ github.run_attempt }}"
          TURN_PASSWORD: "${{ secrets.COTURN_PASSWORD }}"
        run: npx playwright test --project=chromium turn-relay.spec.ts
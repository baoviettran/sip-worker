name: soak

on:
  schedule:
    # Nightly 8h soak — the v0.9 release gate. Off the :00/:30 marks.
    - cron: '23 4 * * *'
  pull_request:

jobs:
  # ── Core soak: split into two 3h halves (GitHub Actions 6h platform cap) ──
  core-soak-1:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Core soak — first 3h
        if: github.event_name == 'schedule'
        run: npm run test:soak:core
        env:
          SOAK_DURATION_MS: '10800000'
          SOAK_INTER_CYCLE_MS: '500'
      - name: Core soak (PR bounded slice)
        if: github.event_name == 'pull_request'
        run: npm run test:soak:core
        env:
          SOAK_DURATION_MS: '900000'
          SOAK_INTER_CYCLE_MS: '250'

  core-soak-2:
    needs: core-soak-1
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Core soak — second 3h
        run: npm run test:soak:core
        env:
          SOAK_DURATION_MS: '10800000'
          SOAK_INTER_CYCLE_MS: '500'

  # ── Browser soak: split into two halves (media timeout at ~475 cycles) ────
  browser-soak-1:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install chromium
        run: npx playwright install --with-deps chromium
      - name: Build / pack the browser package (built artifacts only)
        run: npm run build
      - name: Browser soak — first 1000 cycles
        if: github.event_name == 'schedule'
        run: npm run test:soak:browser
        env:
          SOAK_CYCLES: '1000'
      - name: Browser soak (PR bounded slice)
        if: github.event_name == 'pull_request'
        run: npm run test:soak:browser
        env:
          SOAK_CYCLES: '25'

  browser-soak-2:
    needs: browser-soak-1
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install chromium
        run: npx playwright install --with-deps chromium
      - name: Build / pack the browser package (built artifacts only)
        run: npm run build
      - name: Browser soak — second 1000 cycles
        run: npm run test:soak:browser
        env:
          SOAK_CYCLES: '1000'

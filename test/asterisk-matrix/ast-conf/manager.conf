; test/asterisk-matrix/ast-conf/manager.conf — the AMI control plane astctl.ts
; drives (originate, hangup, contact lookup, DTMF observation). Bound to
; loopback and using the sanctioned matrix credential, exactly like the SIP
; endpoint; `read = all`/`write = all` is what lets the harness issue Originate.
[general]
enabled = yes
webenabled = no
bindaddr = 127.0.0.1
port = __AMI_PORT__

[matrix]
secret = matrix-pass-2026
read = all
write = all

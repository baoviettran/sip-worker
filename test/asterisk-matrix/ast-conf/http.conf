; test/asterisk-matrix/ast-conf/http.conf — the HTTP server that carries SIP over
; WebSocket. WSS SIGNALLING TLS IS CONFIGURED HERE, NOT ON THE PJSIP TRANSPORT:
; the pinned image warns that cert_file/priv_key_file on a websocket transport
; are ignored (res_pjsip/config_transport.c), so a transport-only config passes
; by accident or not at all.
[general]
enabled=yes
bindaddr=127.0.0.1
bindport=__HTTP_PORT__
tlsenable=yes
tlsbindaddr=127.0.0.1:__WSS_PORT__
tlscertfile=/etc/asterisk/matrix/cert.pem
tlsprivatekey=/etc/asterisk/matrix/key.pem

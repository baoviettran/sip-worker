; test/asterisk-matrix/ast-conf/extensions.conf — the matrix dialplan.
[matrix]
; 600 is the matrix's echo/audio target, mirroring FreeSWITCH's 9196: answer,
; record the leg, then echo so the browser hears itself back.
exten => 600,1,Answer()
 same => n,MixMonitor(/recordings/matrix-${UNIQUEID}.wav)
 same => n,Echo()

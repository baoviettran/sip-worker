; test/asterisk-matrix/ast-conf/pjsip.conf — the WebRTC endpoint the browser
; registers as. Rendered per run; ports are tokens.
[global]
type=global
; DTLS-SRTP certificates for the MEDIA path. The signalling path's TLS lives in
; http.conf (see above).
dtls_cert_file=/etc/asterisk/matrix/cert.pem
dtls_private_key=/etc/asterisk/matrix/key.pem

[transport-wss]
type=transport
protocol=wss
bind=127.0.0.1:__WSS_PORT__

[1000]
type=endpoint
context=matrix
disallow=all
; PCMU only: the pinned image ships no codec_opus (spec decision 4).
allow=ulaw
webrtc=yes
media_encryption=dtls
ice_support=yes
direct_media=no
dtmf_mode=rfc4733
auth=1000
aors=1000

[1000]
type=auth
auth_type=userpass
username=1000
password=matrix-pass-2026

[1000]
type=aor
; Two, not one: the WSS-drop recovery step (Task 12) re-registers while the
; pre-drop contact may still be unexpired, and a strict single-contact AOR would
; reject that REGISTER and fail the step for the wrong reason. remove_existing
; makes the newest contact win, so the harness still addresses one endpoint.
max_contacts=2
remove_existing=yes

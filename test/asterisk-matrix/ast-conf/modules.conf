; test/asterisk-matrix/ast-conf/modules.conf
[modules]
autoload=yes
; The pinned image ships format_ogg_vorbis.so broken (missing libvorbisenc), and
; the matrix never uses OGG. Loading it puts a loader ERROR in every boot's log,
; which is noise that trains readers to ignore the log — so it is not loaded.
noload=format_ogg_vorbis.so

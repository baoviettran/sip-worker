# coturn 4.6.2 — forced-TURN relay for the v0.5 browser/Safari release gates.
#
# IMAGE/DIGEST & UPDATE POLICY (verbatim):
#   container image: coturn/coturn:4.6.2
#   immutable digest: sha256:4873c54f213ec81f6b4c4c4938b69c922f50b2293ded427f5191472b9a127227
#   (multi-arch manifest-list digest for tag 4.6.2; verify with:
#    docker manifest inspect coturn/coturn@sha256:4873c54f213ec81f6b4c4c4938b69c922f50b2293ded427f5191472b9a127227)
#   NEVER use `latest`. To update, pick a NEW released coturn (>= 4.6.x), resolve
#   its manifest-list digest, verify it, and commit BOTH the new tag and that digest
#   here. Do not bump the digest of the existing tag assume it is immutable.
#
# This file MOUNTS at /etc/turnserver.conf (CI runner _mounts_ the repo copy; the
# bootstrap script substitutes the two loopback alias IPs below). The per-run
# username/password are generated fresh per workflow run and passed via CLI
# (-u / --use-auth-secret), so NO secrets ever appear in this checked-in file.

# CI-local ports (host-published by the runner; never the privileged default).
listening-port=3478

# Two DISTINCT relay IPs — REQUIRED so coturn relays between the two same-host
# WebRTC peers. Each peer reaches coturn through a different listener, so coturn
# hands each allocation a distinct relay address and forwards media between them.
#   - listener/relay A = 127.0.0.1 -> library's TURN endpoint
#   - listener/relay B = 127.0.0.2 -> synthetic peer's TURN endpoint
# delete_ip_a and delete_ip_b are replaced by the bootstrap script. Without two
# distinct relay IPs (single-IP), coturn cannot relay two same-server allocations
# (each peer would CREATE_PERMISSION for the server's own relay IP, which coturn
# refuses rather than bridging) — the gate must fail then, never pass collapsed.
listening-ip=<IP_LIBRARY>
listening-ip=<IP_PEER>
relay-ip=<IP_LIBRARY>
relay-ip=<IP_PEER>

fingerprint
lt-cred-mech
no-cli

# Long-term credential mechanism; per-run credentials supplied via CLI.
# No credential values appear here and none are logged.

# Loopback relay peers are REQUIRED (both ends are the CI host's own loopback).
allow-loopback-peers

# Only the two loopback aliases may be relayed peers; nothing external. coturn
# accepts these as explicit hosts (the two IPs the bootstrap substitutes).
allowed-peer-ip=127.0.0.1
allowed-peer-ip=127.0.0.2

# Minimal, bounded CI relay.
no-multicast-peers
max-bps=0
server-name=sip-worker-relay

# Logging to stdout, verbose OFF so candidate/address payloads stay out of logs.
log-file=stdout
verbose=false